<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>11</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
<div class="container">
    <div class="main">
        <h1 class="Pricing">Our Pricing</h1>
        <div class="sircle__div">
            <p>Annually</p>
            <img src="img/sircle.png" alt="sircle img">
            <p>Monthly</p>
        </div>
    </div>
    <div class="box">
        <div class="box__div">
            <h3 class="box__h3_2">Basic</h3>
            <p class="box__som2">$199.99</p>
            <div class="Storage2">
                <p>500 GB Storage</p>
                <p>2 Users Allowed</p>
                <p class="last-p">Send up to 3 GB</p>
            </div>
            <div class="learn1"><p>LEARN MORE</p></div>
        </div>
        <div class="box__div2">
            <h3 class="box__h3">Professional</h3>
            <p class="box__som">$249.99</p>
            <div class="Storage">
                <p>1 TB Storage</p>
                <p>5 Users Allowed</p>
                <p class="last-p">Send up to 10 GB</p>
            </div>
            <div class="learn"><p>LEARN MORE</p></div>
        </div>
        <div class="box__div">
            <h3 class="box__h3_2">Master</h3>
            <p class="box__som2">$399.99</p>
            <div class="Storage2">
                <p>2 TB Storage</p>
                <p>10 Users Allowed</p>
                <p class="last-p">Send up to 20 GB</p>
            </div>
            <div class="learn1"><p>LEARN MORE</p></div>
        </div>
        <img class="img" src="img/backfon.svg" alt="back img">
    </div>
</div>
</body>
</html>
